name: selftest

# Exercise the action end to end on every change: install the latest
# perfscale release, run the native engine against a local HTTP server,
# and assert the summary artifacts the README promises.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  native:
    name: native engine (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Start a local target
        shell: bash
        run: |
          python3 -m http.server 18999 &
          for _ in $(seq 1 20); do
            curl -fs http://127.0.0.1:18999/ >/dev/null && break
            sleep 0.5
          done
          curl -fs http://127.0.0.1:18999/ >/dev/null

      - name: Run the action under test
        id: loadtest
        uses: ./
        with:
          file: .github/selftest/test.yaml
          config: .github/selftest/config.yaml
          # Also export the Markdown table to a plain file — asserting the
          # table via $GITHUB_STEP_SUMMARY's _runner_file_commands path is
          # racy (the runner consumes those files between steps; timing
          # differs across OSes).
          args: --summary-export summary.md

      - name: Assert outputs
        shell: bash
        env:
          SUMMARY_JSON: ${{ steps.loadtest.outputs.summary-json }}
          SUMMARY_FILE: ${{ steps.loadtest.outputs.summary-file }}
          OUTPUT_FILE: ${{ steps.loadtest.outputs.output-file }}
          EXIT_CODE: ${{ steps.loadtest.outputs.exit-code }}
        run: |
          set -euo pipefail

          [ "${EXIT_CODE}" = "0" ] || { echo "::error::exit-code=${EXIT_CODE}"; exit 1; }
          [ -f "${SUMMARY_FILE}" ] || { echo "::error::summary-file missing"; exit 1; }
          [ -f "${OUTPUT_FILE}" ]  || { echo "::error::zip artifact missing"; exit 1; }

          [ -n "${SUMMARY_JSON}" ] && [ -f "${SUMMARY_JSON}" ] \
            || { echo "::error::summary-json missing — --summary-export did not run"; exit 1; }
          jq -e '.meta.engine == "native"
                 and .meta.vus == 2
                 and .summary.total_requests > 0
                 and .summary.error_rate == 0' "${SUMMARY_JSON}"

          # The Markdown export (same renderer as the job-summary table)
          # must contain the table.
          grep -q "perfscale run summary" summary.md \
            || { echo "::error::markdown summary table missing"; exit 1; }

      - name: Assert zip contains summary.json
        shell: bash
        env:
          OUTPUT_FILE: ${{ steps.loadtest.outputs.output-file }}
        run: |
          unzip -l "${OUTPUT_FILE}" | grep -q "summary.json" \
            || { echo "::error::summary.json not packed into the artifact"; exit 1; }

  jmeter:
    name: jmeter engine
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Start a local target
        shell: bash
        run: |
          python3 -m http.server 18999 &
          for _ in $(seq 1 20); do
            curl -fs http://127.0.0.1:18999/ >/dev/null && break
            sleep 0.5
          done
          curl -fs http://127.0.0.1:18999/ >/dev/null

      # perfscale shells out to the `jmeter` binary — install it (Java is
      # preinstalled on the runner). Pinned version, archive.apache.org keeps
      # old releases (dlcdn only the latest).
      - name: Install JMeter
        shell: bash
        run: |
          curl -fsSL https://archive.apache.org/dist/jmeter/binaries/apache-jmeter-5.6.3.tgz \
            | tar -xz -C "${RUNNER_TEMP}"
          echo "${RUNNER_TEMP}/apache-jmeter-5.6.3/bin" >> "${GITHUB_PATH}"
          java -version 2>&1 | head -1
          # $GITHUB_PATH applies to the NEXT steps — call by full path here.
          "${RUNNER_TEMP}/apache-jmeter-5.6.3/bin/jmeter" --version 2>&1 | tail -1

      - name: Run the action under test
        id: loadtest
        uses: ./
        with:
          jmeter: .github/selftest/hello.jmx

      - name: Assert outputs
        shell: bash
        env:
          SUMMARY_JSON: ${{ steps.loadtest.outputs.summary-json }}
          EXIT_CODE: ${{ steps.loadtest.outputs.exit-code }}
        run: |
          set -euo pipefail

          [ "${EXIT_CODE}" = "0" ] || { echo "::error::exit-code=${EXIT_CODE}"; exit 1; }
          [ -n "${SUMMARY_JSON}" ] && [ -f "${SUMMARY_JSON}" ] \
            || { echo "::error::summary-json missing — --summary-export did not run"; exit 1; }
          # 2 threads × 5 loops = 10 samples; vus/duration are null for
          # --jmeter (the plan owns the load shape).
          jq -e '.meta.engine == "jmeter"
                 and .summary.total_requests == 10
                 and .summary.error_rate == 0' "${SUMMARY_JSON}"
